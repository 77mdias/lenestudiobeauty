name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira às 05:30 UTC — pega novas regras de segurança
    - cron: "30 5 * * 1"

jobs:
  analyze:
    name: Análise de segurança (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Análise CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
